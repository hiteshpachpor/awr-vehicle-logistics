services:
  application:
    build:
      context: .
      target: development
    command:
      [
        "sh",
        "-c",
        "npm run db:migrate && npm run db:seed && npm run dev -- --hostname 0.0.0.0",
      ]
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - next-cache:/app/.next

volumes:
  node-modules:
  next-cache:
